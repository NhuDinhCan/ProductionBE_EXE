spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: ${JPA_FORMAT_SQL:false}

server:
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20s}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}

ai:
  base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
  model: ${AI_MODEL:deepseek/deepseek-chat-v3-0324:free}
  api-key: ${AI_API_KEY}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}

app:
  allowed-origins: ${ALLOWED_ORIGINS}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    auth-limit: ${RATE_LIMIT_AUTH_LIMIT:20}
    register-limit: ${RATE_LIMIT_REGISTER_LIMIT:10}
  websocket:
    broker:
      relay:
        enabled: ${WEBSOCKET_BROKER_RELAY_ENABLED:true}
        host: ${WEBSOCKET_BROKER_RELAY_HOST}
        port: ${WEBSOCKET_BROKER_RELAY_PORT:61613}
        client-login: ${WEBSOCKET_BROKER_RELAY_CLIENT_LOGIN}
        client-passcode: ${WEBSOCKET_BROKER_RELAY_CLIENT_PASSCODE}
        system-login: ${WEBSOCKET_BROKER_RELAY_SYSTEM_LOGIN}
        system-passcode: ${WEBSOCKET_BROKER_RELAY_SYSTEM_PASSCODE}
        virtual-host: ${WEBSOCKET_BROKER_RELAY_VIRTUAL_HOST:/}
