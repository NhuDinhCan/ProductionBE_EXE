spring:
  application:
    name: production

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/exe?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: ${JPA_FORMAT_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000
  revoked-token-cleanup-interval-ms: 3600000

ai:
  base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
  model: ${AI_MODEL:deepseek/deepseek-chat-v3-0324:free}
  api-key: ${AI_API_KEY:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  websocket:
    broker:
      relay:
        enabled: ${WEBSOCKET_BROKER_RELAY_ENABLED:false}
        host: ${WEBSOCKET_BROKER_RELAY_HOST:localhost}
        port: ${WEBSOCKET_BROKER_RELAY_PORT:61613}
        client-login: ${WEBSOCKET_BROKER_RELAY_CLIENT_LOGIN:guest}
        client-passcode: ${WEBSOCKET_BROKER_RELAY_CLIENT_PASSCODE:guest}
        system-login: ${WEBSOCKET_BROKER_RELAY_SYSTEM_LOGIN:guest}
        system-passcode: ${WEBSOCKET_BROKER_RELAY_SYSTEM_PASSCODE:guest}
        virtual-host: ${WEBSOCKET_BROKER_RELAY_VIRTUAL_HOST:}
